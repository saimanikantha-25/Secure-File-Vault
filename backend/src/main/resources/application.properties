spring.application.name=secure-file-vault
server.port=8080

# Logging Configurations
logging.level.root=INFO
logging.level.com.saimanikantha.securefilevault=DEBUG

# ==========================================
# DATABASE CONFIGURATIONS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:secure_file_vault}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA / HIBERNATE CONFIGURATIONS
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY CONFIGURATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Actuator Configurations
management.endpoints.web.exposure.include=health
